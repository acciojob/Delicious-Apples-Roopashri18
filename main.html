<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Delicious Apples</title>
	<meta name="description" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="/styles.css">

	<style>
		* { box-sizing: border-box; }

		html, body { overflow-x: hidden; }

		body {
			margin: 0;
			min-height: 100vh;
			background-color: #00e583;
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: Raleway, Arial, Helvetica, sans-serif;
			color: #444;
		}

		body .product {
			display: flex;
			flex-wrap: nowrap;
			align-items: center;
			width: 520px;
			background: #fff;
			border-radius: 6px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
			padding: 30px 20px 30px 0;
			margin: 0 0 0 40px;
		}

		body .product .product__photo {
			flex: 0 0 200px;
			width: 200px;
			margin: -20px 0 -20px -40px;
			z-index: 1;
		}

		body .product .photo-container {
			width: 200px;
			background: #fff;
			border-radius: 6px;
			overflow: hidden;
			box-shadow: 0 10px 25px rgba(0, 0, 0, .25);
		}

		body .product .photo-main {
			position: relative;
			width: 200px;
			height: 230px;
			background: linear-gradient(160deg, #bff25a 0%, #6ec02c 100%);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		body .product .photo-main > img {
			width: 90%;
			max-width: 90%;
			height: auto;
			max-height: 200px;
			object-fit: contain;
		}

		body .product .photo-main .controls {
			position: absolute;
			top: 0; left: 0; right: 0;
			display: flex;
			justify-content: space-between;
			padding: 8px;
			color: #fff;
			font-size: 12px;
		}

		body .product .photo-album ul {
			display: flex;
			justify-content: space-between;
			gap: 4px;
			list-style: none;
			margin: 0;
			padding: 10px;
		}

		body .product .photo-album li { margin: 0; padding: 0; }

		body .product .photo-album li img {
			width: 34px !important;
			height: 34px !important;
			object-fit: contain;
			border: 1px solid #eee;
			padding: 3px;
			border-radius: 3px;
			cursor: pointer;
		}

		body .product .product__info {
			flex: 1;
			min-width: 0;
			padding-left: 25px;
		}

		body .product .title h1 { font-size: 1rem; margin: 0; color: #444; }
		body .product .title span { font-size: .6rem; color: #aaa; }

		body .product .price { margin: 16px 0; color: #ff4a4a; font-size: .8rem; }
		body .product .price span { font-size: 2rem; font-weight: 300; }

		body .product .variant h3,
		body .product .description h3 {
			font-size: .55rem;
			letter-spacing: 1px;
			color: #aaa;
			margin: 0 0 6px;
		}

		body .product .variant ul {
			display: flex;
			gap: 6px;
			list-style: none;
			margin: 0 0 16px;
			padding: 0 0 0 16px;
		}

		body .product .variant li img {
			width: 20px !important;
			height: 20px !important;
			object-fit: contain;
			cursor: pointer;
		}

		body .product .description ul {
			margin: 0 0 18px;
			padding-left: 30px;
			font-size: .6rem;
			line-height: 1.8;
			color: #555;
		}

		body .product .add-to-cart {
			background-color: #ff4a4a;
			color: #fff;
			border: none;
			border-radius: 4px;
			padding: 10px 20px;
			font-size: .55rem;
			font-weight: 700;
			letter-spacing: 1px;
			cursor: pointer;
			box-shadow: 0 6px 12px rgba(255, 74, 74, .4);
		}
	</style>
</head>

<body>
	<section class="product">
		<div class="product__photo">
			<div class="photo-container">
				<div class="photo-main">
					<div class="controls">
						<i class="fa fa-share-alt"></i>
						<i class="fa fa-heart-o"></i>
					</div>
					<img src="https://res.cloudinary.com/john-mantas/image/upload/v1537291846/codepen/delicious-apples/green-apple-with-slice.png"
						alt="green apple slice">
				</div>
				<div class="photo-album">
					<ul>
						<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
								alt="green apple"></li>
						<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303532/codepen/delicious-apples/half-apple.png"
								alt="half apple"></li>
						<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303160/codepen/delicious-apples/green-apple-flipped.png"
								alt="green apple"></li>
						<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303708/codepen/delicious-apples/apple-top.png"
								alt="apple top"></li>
					</ul>
				</div>
			</div>
		</div>
		<div class="product__info">
			<div class="title">
				<h1>Delicious Apples</h1>
				<span>CODE: 45999</span>
			</div>
			<div class="price">
				$ <span>7.93</span>
			</div>
			<div class="variant">
				<h3>SELECT A COLOR</h3>
				<ul>
					<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
							alt="green apple"></li>
					<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png"
							alt="yellow apple"></li>
					<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png"
							alt="orange apple"></li>
					<li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png"
							alt="red apple"></li>
				</ul>
			</div>
			<div class="description">
				<h3>BENEFITS</h3>
				<ul>
					<li>Apples are nutricious</li>
					<li>Apples may be good for weight loss</li>
					<li>Apples may be good for bone health</li>
					<li>They're linked to a lowest risk of diabetes</li>
				</ul>
			</div>
			<button type="button" class="add-to-cart">ADD TO CART</button>
		</div>
	</section>
</body>

</html>
